[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-lab"
version = "0.6.3"
description = "An evidence-grounded autoresearch harness with bounded context, literature and code research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3", "torch>=2.1,<3", "pydantic>=2.7,<3", "httpx>=0.27,<1",
  "PyYAML>=6,<7", "h5py>=3.9,<4", "safetensors>=0.4,<1",
]

[project.optional-dependencies]
research = ["pypdf>=5,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
arlab = "arlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arlab = ["assets/*.json", "skills/*.md", "templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: launches real training subprocesses", "d4rl: requires legacy D4RL installation and data"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
